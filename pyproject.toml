[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "research-data-analyzer"
version = "0.1.0"
description = "A modular Python tool for analyzing and reporting insights from structured datasets."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
