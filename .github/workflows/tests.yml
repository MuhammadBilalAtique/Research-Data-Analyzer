name: Python tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and visualization extra
        run: python -m pip install -e ".[visualization]"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
